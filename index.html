<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <nav class="navbar navbar-light bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Shopping Cart</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="shopping-card-container" aria-labelledby="cart-heading">
      <h1 id="cart-heading" class="visually-hidden">Your shopping cart</h1>
      <p class="total-price" aria-live="polite">
        <span>Total price:</span>
        <span class="total">$0.00</span>
      </p>

      <div class="list-products">
        <article class="product-item">
          <div class="card">
            <div class="product-visual baskets-visual" role="img" aria-label="Baskets">👟</div>
            <div class="card-body">
              <h2 class="card-title">Baskets</h2>
              <p class="card-text">This is a basket</p>
              <p class="unit-price">KSh 100.00</p>
              <div class="quantity-controls" aria-label="Baskets quantity">
                <button class="icon-button" type="button" data-action="increase" aria-label="Increase baskets quantity">
                  <i class="fas fa-plus-circle" aria-hidden="true"></i>
                </button>
                <span class="quantity" aria-live="polite">1</span>
                <button class="icon-button" type="button" data-action="decrease" aria-label="Decrease baskets quantity">
                  <i class="fas fa-minus-circle" aria-hidden="true"></i>
                </button>
              </div>
              <div class="product-actions">
                <button class="icon-button remove-button" type="button" data-action="remove" aria-label="Remove baskets from cart">
                  <i class="fas fa-trash-alt" aria-hidden="true"></i>
                </button>
                <button class="icon-button like-button" type="button" data-action="like" aria-label="Like baskets" aria-pressed="false">
                  <i class="fas fa-heart" aria-hidden="true"></i>
                </button>
              </div>
            </div>
          </div>
        </article>

        <article class="product-item">
          <div class="card">
            <div class="product-visual socks-visual" role="img" aria-label="Socks">🧦</div>
            <div class="card-body">
              <h2 class="card-title">Socks</h2>
              <p class="card-text">This is a pair of socks</p>
              <p class="unit-price">KSh 20.00</p>
              <div class="quantity-controls" aria-label="Socks quantity">
                <button class="icon-button" type="button" data-action="increase" aria-label="Increase socks quantity">
                  <i class="fas fa-plus-circle" aria-hidden="true"></i>
                </button>
                <span class="quantity" aria-live="polite">1</span>
                <button class="icon-button" type="button" data-action="decrease" aria-label="Decrease socks quantity">
                  <i class="fas fa-minus-circle" aria-hidden="true"></i>
                </button>
              </div>
              <div class="product-actions">
                <button class="icon-button remove-button" type="button" data-action="remove" aria-label="Remove socks from cart">
                  <i class="fas fa-trash-alt" aria-hidden="true"></i>
                </button>
                <button class="icon-button like-button" type="button" data-action="like" aria-label="Like socks" aria-pressed="false">
                  <i class="fas fa-heart" aria-hidden="true"></i>
                </button>
              </div>
            </div>
          </div>
        </article>

        <article class="product-item">
          <div class="card">
            <div class="product-visual bag-visual" role="img" aria-label="Bag">👜</div>
            <div class="card-body">
              <h2 class="card-title">Bag</h2>
              <p class="card-text">This is a bag</p>
              <p class="unit-price">KSh 50.00</p>
              <div class="quantity-controls" aria-label="Bag quantity">
                <button class="icon-button" type="button" data-action="increase" aria-label="Increase bag quantity">
                  <i class="fas fa-plus-circle" aria-hidden="true"></i>
                </button>
                <span class="quantity" aria-live="polite">1</span>
                <button class="icon-button" type="button" data-action="decrease" aria-label="Decrease bag quantity">
                  <i class="fas fa-minus-circle" aria-hidden="true"></i>
                </button>
              </div>
              <div class="product-actions">
                <button class="icon-button remove-button" type="button" data-action="remove" aria-label="Remove bag from cart">
                  <i class="fas fa-trash-alt" aria-hidden="true"></i>
                </button>
                <button class="icon-button like-button" type="button" data-action="like" aria-label="Like bag" aria-pressed="false">
                  <i class="fas fa-heart" aria-hidden="true"></i>
                </button>
              </div>
            </div>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
